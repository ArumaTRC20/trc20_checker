<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRC20 Checker</title><style>body{margin:0;background:#0f0f12;color:#fff;font-family:system-ui;display:flex;justify-content:center;padding:20px;min-height:100vh}.card{background:#1a1a20;border:1px solid #333;border-radius:20px;padding:24px;max-width:480px;width:100%}.big{font-size:28px;font-weight:bold}h1{text-align:center}input{width:100%;background:#0f0f12;border:1px solid #333;color:#fff;padding:14px;border-radius:12px;margin:12px 0;box-sizing:border-box}button{width:100%;background:#26a17b;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:bold} .bal{margin-top:12px;padding:16px;background:#0f0f12;border-radius:12px;border:1px solid #333}</style></head><body><div class="card"><h1>🔍 TRC20 Checker</h1><p style="text-align:center;opacity:.6">ArumaTRC20 - Check USDT & TRX</p><input id="addr" placeholder="Enter TRON address T..."><button onclick="check()">Check Balance</button><div id="out"></div></div><script>async function check(){let a=document.getElementById('addr').value.trim();let o=document.getElementById('out');if(!a.startsWith('T')){o.innerHTML='<div class=bal>Invalid address</div>';return;}o.innerHTML='<div class=bal>Checking...</div>';try{let r1=await fetch('https://api.trongrid.io/v1/accounts/'+a);let d1=await r1.json();let trx=(d1.data?.[0]?.balance||0)/1e6;let r2=await fetch('https://apilist.tronscan.org/api/account/tokens?address='+a);let d2=await r2.json();let usdt=0;if(d2.data){let f=d2.data.find(x=>x.tokenAbbr=='USDT');if(f)usdt=f.balance/Math.pow(10,f.tokenDecimal||6);}o.innerHTML=`<div class=bal><div>USDT (TRC20)</div><div class=big>${usdt} USDT</div><div>≈ $${usdt} USD</div></div><div class=bal><div>TRX</div><div class=big>${trx} TRX</div></div><a href="https://tronscan.org/#/address/${a}" target=_blank style="display:block;text-align:center;margin-top:12px;color:#26a17b">View on Tronscan ↗</a>`}catch(e){o.innerHTML='<div class=bal>Error - try again</div>'}}</script></body></html>
